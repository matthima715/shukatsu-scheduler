<title>就活手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 手帳の見開き — 上に要約の帯、下にタブ（予定リスト / 月間カレンダー / 選考ボード） */
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#18213B; --muted:#5E6782; --line:#D5DAE5; --soft:#E4E8F0;
  --accent:#2B3A8C; --accent-ink:#FFFFFF; --accent-soft:#E2E6F7;
  --danger:#B42318; --danger-soft:#FDECEA; --sun:#C2410C; --sat:#1D4ED8;
  --t-es:#C2410C; --t-es-bg:#FDEBDF;
  --t-test:#7C3AED; --t-test-bg:#EFE7FD;
  --t-setsu:#0E7490; --t-setsu-bg:#DDF2F6;
  --t-men:#2B3A8C; --t-men-bg:#E2E6F7;
  --t-gd:#B45309; --t-gd-bg:#FBF0D9;
  --t-intern:#15803D; --t-intern-bg:#DFF3E5;
  --t-naitei:#BE185D; --t-naitei-bg:#FCE4EF;
  --t-other:#475569; --t-other-bg:#E9ECF1;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --paper:#171C2C; --ink:#E7EAF3; --muted:#9AA3BE; --line:#2B3248; --soft:#20263A;
  --accent:#9AA8F5; --accent-ink:#0F1320; --accent-soft:#252C4E;
  --danger:#F38B80; --danger-soft:#3A1D1E; --sun:#F59E6B; --sat:#8DB0FF;
  --t-es:#F6A06E; --t-es-bg:#3A2418;
  --t-test:#C4A5FB; --t-test-bg:#2C2142;
  --t-setsu:#6CCFE2; --t-setsu-bg:#14323A;
  --t-men:#A9B5F7; --t-men-bg:#252C4E;
  --t-gd:#F1C46B; --t-gd-bg:#372A12;
  --t-intern:#7DD99A; --t-intern-bg:#16321F;
  --t-naitei:#F592C0; --t-naitei-bg:#3B1A2A;
  --t-other:#B4BCCD; --t-other-bg:#262C3B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320; --paper:#171C2C; --ink:#E7EAF3; --muted:#9AA3BE; --line:#2B3248; --soft:#20263A;
  --accent:#9AA8F5; --accent-ink:#0F1320; --accent-soft:#252C4E;
  --danger:#F38B80; --danger-soft:#3A1D1E; --sun:#F59E6B; --sat:#8DB0FF;
  --t-es:#F6A06E; --t-es-bg:#3A2418;
  --t-test:#C4A5FB; --t-test-bg:#2C2142;
  --t-setsu:#6CCFE2; --t-setsu-bg:#14323A;
  --t-men:#A9B5F7; --t-men-bg:#252C4E;
  --t-gd:#F1C46B; --t-gd-bg:#372A12;
  --t-intern:#7DD99A; --t-intern-bg:#16321F;
  --t-naitei:#F592C0; --t-naitei-bg:#3B1A2A;
  --t-other:#B4BCCD; --t-other-bg:#262C3B;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-weight:900;font-size:28px;letter-spacing:.04em;line-height:1.2}
.brand .today{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.home{justify-self:start;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:-10px}
.home:hover{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--paper)}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner b{color:var(--accent)}

/* summary */
.summary{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum{background:var(--paper);padding:14px 16px;display:grid;gap:2px;min-width:0}
.sum .lbl{font-size:12px;color:var(--muted);letter-spacing:.08em}
.sum .val{font-size:26px;font-weight:900;line-height:1.2}
.sum .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.sum .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum.next .val{color:var(--danger)}
@media (max-width:720px){.summary{grid-template-columns:1fr 1fr}.sum.next{grid-column:1/-1}}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* type chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.ty-es{color:var(--t-es);background:var(--t-es-bg)}
.ty-test{color:var(--t-test);background:var(--t-test-bg)}
.ty-setsu{color:var(--t-setsu);background:var(--t-setsu-bg)}
.ty-men{color:var(--t-men);background:var(--t-men-bg)}
.ty-gd{color:var(--t-gd);background:var(--t-gd-bg)}
.ty-intern{color:var(--t-intern);background:var(--t-intern-bg)}
.ty-naitei{color:var(--t-naitei);background:var(--t-naitei-bg)}
.ty-other{color:var(--t-other);background:var(--t-other-bg)}

/* agenda */
.agenda{display:grid;gap:22px}
.group h2{margin:0 0 8px;font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center}
.group h2 .count{font-family:var(--f-mono)}
.group.overdue h2{color:var(--danger)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 92px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--soft)}
.row:first-child{border-top:0}
.row.done .main{opacity:.45;text-decoration:line-through}
.row .when{display:grid;line-height:1.25}
.row .when .d{font-family:var(--f-mono);font-size:14px;font-weight:500}
.row .when .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.row .main{min-width:0;display:grid;gap:2px}
.row .main .ttl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .main .co{font-weight:700;background:none;border:0;padding:0;text-align:left}
.row .main .co:hover{text-decoration:underline}
.row .main .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .left{font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap;text-align:right}
.row .left.hot{color:var(--danger)}
.row .left.past{color:var(--muted)}
.chk{width:20px;height:20px;accent-color:var(--accent)}
.rowedit{border:0;background:none;color:var(--muted);font-size:12px;padding:0;text-decoration:underline}
@media (max-width:560px){.row{grid-template-columns:auto 1fr auto}.row .when{grid-column:2;grid-row:1;display:flex;gap:8px}.row .main{grid-column:1/-1}.row .left{grid-column:3;grid-row:1}}

.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead .ym{font-size:20px;font-weight:900}
.calhead .ym .mono{font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dow{background:var(--soft);text-align:center;font-size:12px;font-weight:700;padding:4px 0;color:var(--muted)}
.dow.sun{color:var(--sun)}.dow.sat{color:var(--sat)}
.cell{background:var(--paper);min-height:96px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0;border:0;text-align:left;align-items:stretch}
.cell.out{background:var(--soft)}
.cell.out .num{opacity:.5}
.cell .num{font-family:var(--f-mono);font-size:13px;font-weight:500;align-self:flex-start;padding:0 5px;border-radius:999px}
.cell.sun .num{color:var(--sun)}.cell.sat .num{color:var(--sat)}
.cell.today .num{background:var(--accent);color:var(--accent-ink)}
.cev{font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;width:100%}
.cev.done{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--muted)}
@media (max-width:640px){.cell{min-height:58px}.cev{font-size:0;height:6px;padding:0;width:auto}.cevs{display:flex;flex-wrap:wrap;gap:2px}.more{font-size:10px}}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* board */
.boardwrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;min-width:min-content}
.col{background:var(--soft);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{margin:2px 4px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted)}
.col h3 .mono{font-weight:500}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:4px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .nm{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.card .ind{font-size:12px;color:var(--muted)}
.card .nx{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stars{color:var(--t-gd);letter-spacing:-1px;font-size:12px;white-space:nowrap}
.col.ng{opacity:.7}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,14,30,.45)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg h2{margin:0;font-size:18px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.dlgfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dlgfoot .r{display:flex;gap:8px;margin-left:auto}
.colist{display:grid;gap:6px}
.coev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;padding:6px 0;border-top:1px solid var(--soft)}
.coev .mono{min-width:88px}
.linkrow{font-size:13px;overflow-wrap:anywhere}
.linkrow a{color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.card{transition:border-color .15s,background .15s,color .15s}}
</style>

<div class="wrap">
  <a class="home" href="./">← トップへ</a>
  <header class="top">
    <div class="brand">
      <h1>就活手帳</h1>
      <div class="today" id="todayLbl"></div>
    </div>
    <div class="actions">
      <button class="btn" id="addCoBtn" type="button">＋ 企業を追加</button>
      <button class="btn primary" id="addEvBtn" type="button">＋ 予定を追加</button>
    </div>
  </header>

  <div class="banner" id="sampleBanner" hidden>
    <span><b>サンプル表示中</b>　架空の企業で使い方を見せています。最初の企業を追加するとサンプルは消えます。</span>
    <button class="btn" type="button" id="keepSample">サンプルを編集して使う</button>
  </div>
  <div class="banner" id="localBanner" hidden>
    <span>この端末のブラウザにだけ保存しています。別の端末からは見えません。</span>
  </div>

  <section class="summary" id="summary" aria-label="サマリー"></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="agenda" id="tab-agenda">予定リスト</button>
    <button class="tab" role="tab" data-view="calendar" id="tab-calendar">カレンダー</button>
    <button class="tab" role="tab" data-view="board" id="tab-board">選考ボード</button>
  </nav>

  <section id="view-agenda" hidden>
    <div class="filters" id="typeFilters" style="margin-bottom:14px"></div>
    <div class="agenda" id="agenda"></div>
  </section>
  <section id="view-calendar" hidden>
    <div class="calhead">
      <button class="btn ghost" type="button" id="prevM" aria-label="前の月">←</button>
      <div class="ym" id="ymLbl"></div>
      <div style="display:flex;gap:6px">
        <button class="btn ghost" type="button" id="thisM">今月</button>
        <button class="btn ghost" type="button" id="nextM" aria-label="次の月">→</button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section id="view-board" hidden>
    <div class="boardwrap"><div class="board" id="board"></div></div>
  </section>
</div>

<dialog id="coDlg">
  <form class="dlg" id="coForm" method="dialog">
    <h2 id="coDlgTtl">企業を追加</h2>
    <div class="field"><label for="coName">企業名</label><input id="coName" required maxlength="80" placeholder="例：株式会社〇〇"></div>
    <div class="grid2">
      <div class="field"><label for="coInd">業界・職種</label><input id="coInd" maxlength="60" placeholder="例：IT / 総合職"></div>
      <div class="field"><label for="coPri">志望度</label>
        <select id="coPri"><option value="3">★★★ 第一志望群</option><option value="2">★★ 志望</option><option value="1">★ 様子見</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="coStage">選考状況</label><select id="coStage"></select></div>
      <div class="field"><label for="coLogin">マイページID</label><input id="coLogin" maxlength="80" placeholder="パスワードは書かないでください"></div>
    </div>
    <div class="field"><label for="coUrl">マイページURL</label><input id="coUrl" type="url" maxlength="300" placeholder="https://"></div>
    <div class="field"><label for="coNote">メモ（志望動機・面接で聞かれたことなど）</label><textarea id="coNote" maxlength="4000"></textarea></div>
    <div id="coEvents" class="colist"></div>
    <div class="dlgfoot">
      <button class="btn danger" type="button" id="coDel" hidden>削除</button>
      <div class="r">
        <button class="btn ghost" type="button" data-close>閉じる</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="evDlg">
  <form class="dlg" id="evForm" method="dialog">
    <h2 id="evDlgTtl">予定を追加</h2>
    <div class="field"><label for="evCo">企業</label><select id="evCo" required></select>
      <span class="note" id="evCoNote" hidden>先に「企業を追加」から企業を登録してください。</span></div>
    <div class="grid2">
      <div class="field"><label for="evType">種類</label><select id="evType"></select></div>
      <div class="field"><label for="evTitle">内容（任意）</label><input id="evTitle" maxlength="80" placeholder="例：一次面接（オンライン）"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="evDate">日付</label><input id="evDate" type="date" required></div>
      <div class="field"><label for="evTime">時刻（締切なら締切時刻）</label><input id="evTime" type="time"></div>
    </div>
    <div class="field"><label for="evPlace">場所・URL・持ち物</label><input id="evPlace" maxlength="200"></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="evDone" class="chk"> 完了した</label>
    <div class="dlgfoot">
      <button class="btn danger" type="button" id="evDel" hidden>削除</button>
      <div class="r">
        <button class="btn ghost" type="button" data-close>閉じる</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
(() => {
const TYPES = [
  {k:"es",l:"ES締切"},{k:"test",l:"Webテスト"},{k:"setsu",l:"説明会"},{k:"men",l:"面接"},
  {k:"gd",l:"GD"},{k:"intern",l:"インターン"},{k:"naitei",l:"内定承諾期限"},{k:"other",l:"その他"}];
const TYPE = Object.fromEntries(TYPES.map(t=>[t.k,t]));
const STAGES = ["気になる","エントリー済","ES提出済","Webテスト","一次面接","二次面接","最終面接","内定","お見送り"];
const WD = ["日","月","火","水","木","金","土"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const diffDays = s => Math.round((parse(s) - today())/86400000);
const addDays = (n) => { const d = today(); d.setDate(d.getDate()+n); return ymd(d); };
const fmtMD = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const leftLabel = (n) => n===0 ? "今日" : n===1 ? "明日" : n>0 ? `あと${n}日` : `${-n}日前`;

let state = { companies: [], mode: "loading", sample: false };
let view = "agenda";
let calMonth = (() => { const d = today(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let typeFilter = new Set();
let store = null; // {save(c), remove(id)}

try { const v = localStorage.getItem("shk.view"); if (v) view = v; } catch {}

/* ---------- sample data (relative to today) ---------- */
function sampleData(){
  const ev = (type,day,time,title,place,done=false)=>({id:rid(),type,date:addDays(day),time,title,place,done});
  return [
    {id:"s1",name:"北斗ソフトウェア",industry:"IT / エンジニア職",priority:3,stage:"一次面接",url:"",login:"",note:"ガクチカは研究室のデータ整理の話で。逆質問を3つ用意。",
      events:[ev("es",-9,"23:59","本選考ES","マイページ",true),ev("test",-4,"23:59","玉手箱","自宅受験",true),ev("men",3,"14:00","一次面接","オンライン（Zoom）")]},
    {id:"s2",name:"みなと海運",industry:"物流 / 総合職",priority:2,stage:"ES提出済",url:"",login:"",note:"",
      events:[ev("es",-2,"12:00","本選考ES","",true),ev("test",1,"23:59","SPI","テストセンター予約済")]},
    {id:"s3",name:"青葉フードサービス",industry:"食品 / 企画職",priority:2,stage:"エントリー済",url:"",login:"",note:"",
      events:[ev("setsu",0,"18:00","会社説明会","オンライン"),ev("es",6,"23:59","本選考ES","設問3つ・各400字")]},
    {id:"s4",name:"東雲フィナンシャル",industry:"金融 / 総合職",priority:3,stage:"最終面接",url:"",login:"",note:"",
      events:[ev("men",9,"10:30","最終面接","本社 15F・スーツ")]},
    {id:"s5",name:"若葉コンサルティング",industry:"コンサル",priority:1,stage:"気になる",url:"",login:"",note:"",
      events:[ev("intern",15,"","冬インターン応募締切","")]},
    {id:"s6",name:"白樺化学",industry:"メーカー / 研究職",priority:3,stage:"内定",url:"",login:"",note:"",
      events:[ev("naitei",12,"17:00","内定承諾の回答期限","人事へメール")]},
    {id:"s7",name:"湊町メディア",industry:"広告",priority:1,stage:"お見送り",url:"",login:"",note:"",events:[]},
  ];
}

/* ---------- persistence ---------- */
function localStore(){
  const KEY="shk.companies";
  let list=[];
  try { list = JSON.parse(localStorage.getItem(KEY)||"[]"); } catch {}
  const write=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state.companies)); }catch{} };
  return {
    initial: list,
    async save(c){ const i=state.companies.findIndex(x=>x.id===c.id); if(i>=0) state.companies[i]=c; else state.companies.push(c); write(); render(); },
    async remove(id){ state.companies = state.companies.filter(x=>x.id!==id); write(); render(); },
  };
}

async function boot(){
  render();
  const cloud = await (window.cloudReady || null);
  if (cloud) {
    const col = cloud.collection("companies");
    let writable = true;
    store = {
      async save(c){ try { await col.doc(c.id).set(JSON.parse(JSON.stringify(c))); } catch(e){ toast(e?.code==="quota_exceeded"?"保存容量の上限です。古い企業を削除してください":"保存できませんでした。もう一度お試しください"); throw e; } },
      async remove(id){ try { await col.doc(id).delete(); } catch(e){ toast("削除できませんでした"); } },
    };
    let checked = false;
    col.onSnapshot(async snap => {
      const list = snap.docs.map(d => ({...d.data(), id:d.id}));
      if (!checked && !snap.fromCache) {
        checked = true;
        try { if (!list.length && await cloud.importLocal("shk.companies","companies")) { toast("この端末のデータをクラウドに移しました"); return; } }
        catch { toast("この端末のデータをクラウドに移せませんでした"); }
      }
      state.mode="db";
      if (list.length) { state.companies = list; state.sample=false; }
      else { state.companies = sampleData(); state.sample=true; }
      render();
    }, () => { fallbackLocal(); });
  } else fallbackLocal();
}
function fallbackLocal(){
  const ls = localStore(); store = ls; state.mode="local";
  if (ls.initial.length){ state.companies = ls.initial; state.sample=false; }
  else { state.companies = sampleData(); state.sample=true; }
  render();
}
async function persist(c){
  if (state.sample) await clearSample();
  await store.save(c);
}
async function clearSample(){
  state.sample=false; state.companies=[];
}
$("#keepSample").onclick = async () => {
  const list = state.companies.slice();
  state.sample=false; state.companies=[];
  for (const c of list) await store.save(c);
  toast("サンプルを保存しました。自由に書き換えてください");
};

/* ---------- derived ---------- */
function allEvents(){
  const out=[];
  for (const c of state.companies) for (const e of (c.events||[])) out.push({...e, co:c});
  out.sort((a,b)=> (a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99")));
  return out;
}

/* ---------- render ---------- */
function render(){
  const t = today();
  $("#todayLbl").textContent = `${t.getFullYear()}.${pad(t.getMonth()+1)}.${pad(t.getDate())} ${WD[t.getDay()]}曜日`;
  $("#sampleBanner").hidden = !state.sample;
  $("#localBanner").hidden = !(state.mode==="local");
  for (const v of ["agenda","calendar","board"]) {
    $("#view-"+v).hidden = v!==view;
    $("#tab-"+v).setAttribute("aria-selected", v===view);
  }
  renderSummary(); renderFilters(); renderAgenda(); renderCal(); renderBoard();
}

function renderSummary(){
  const evs = allEvents().filter(e=>!e.done);
  const deadlines = evs.filter(e=>["es","test","naitei","intern"].includes(e.type) && diffDays(e.date)>=0);
  const nx = deadlines[0];
  const week = evs.filter(e=>{const n=diffDays(e.date); return n>=0 && n<7;}).length;
  const overdue = evs.filter(e=>diffDays(e.date)<0).length;
  const active = state.companies.filter(c=>!["気になる","内定","お見送り"].includes(c.stage)).length;
  const offers = state.companies.filter(c=>c.stage==="内定").length;
  $("#summary").innerHTML = `
    <div class="sum next"><span class="lbl">次の締切</span>
      ${nx ? `<span class="val">${leftLabel(diffDays(nx.date))}<small class="mono">${fmtMD(nx.date)} ${esc(nx.time||"")}</small></span>
      <span class="sub">${esc(nx.co.name)}・${esc(TYPE[nx.type]?.l)}</span>` : `<span class="val" style="color:var(--muted)">なし</span><span class="sub">締切の予定はまだありません</span>`}</div>
    <div class="sum"><span class="lbl">7日以内の予定</span><span class="val mono">${week}<small>件</small></span><span class="sub">${overdue?`未完了の期限切れ ${overdue}件`:"期限切れなし"}</span></div>
    <div class="sum"><span class="lbl">選考中</span><span class="val mono">${active}<small>社</small></span><span class="sub">登録 ${state.companies.length}社</span></div>
    <div class="sum"><span class="lbl">内定</span><span class="val mono">${offers}<small>社</small></span><span class="sub">&nbsp;</span></div>`;
}

function renderFilters(){
  $("#typeFilters").innerHTML = `<span class="note">絞り込み</span>` + TYPES.map(t=>`<button type="button" class="chipbtn" data-type="${t.k}" aria-pressed="${typeFilter.has(t.k)}">${t.l}</button>`).join("");
}

function evRow(e){
  const n = diffDays(e.date);
  const cls = e.done ? "past" : n<=2 ? "hot" : n<0 ? "hot" : "";
  return `<div class="row ${e.done?"done":""}">
    <input type="checkbox" class="chk" aria-label="完了" data-done="${e.co.id}|${e.id}" ${e.done?"checked":""}>
    <div class="when"><span class="d">${fmtMD(e.date)}</span><span class="t">${esc(e.time||"終日")}</span></div>
    <div class="main">
      <div class="ttl"><span class="chip ty-${e.type}">${esc(TYPE[e.type]?.l||"その他")}</span>
        <button type="button" class="co" data-co="${e.co.id}">${esc(e.co.name)}</button>
        ${e.title?`<span>${esc(e.title)}</span>`:""}</div>
      <div class="sub">${e.place?esc(e.place)+"　":""}<button type="button" class="rowedit" data-ev="${e.co.id}|${e.id}">編集</button></div>
    </div>
    <div class="left ${cls}">${e.done?"完了":leftLabel(n)}</div>
  </div>`;
}

function renderAgenda(){
  let evs = allEvents();
  if (typeFilter.size) evs = evs.filter(e=>typeFilter.has(e.type));
  if (!state.companies.length && !state.sample) {
    $("#agenda").innerHTML = `<div class="empty">まだ予定がありません。<br>「＋ 企業を追加」で志望企業を登録し、「＋ 予定を追加」でES締切や面接日を入れましょう。</div>`;
    return;
  }
  const groups = [
    {k:"overdue",l:"期限切れ・未完了",f:e=>!e.done && diffDays(e.date)<0},
    {k:"today",l:"今日",f:e=>diffDays(e.date)===0},
    {k:"tomorrow",l:"明日",f:e=>diffDays(e.date)===1},
    {k:"week",l:"7日以内",f:e=>{const n=diffDays(e.date);return n>=2&&n<7;}},
    {k:"later",l:"それ以降",f:e=>diffDays(e.date)>=7},
    {k:"past",l:"終わった予定",f:e=>e.done && diffDays(e.date)<0},
  ];
  const html = groups.map(g=>{
    const items = evs.filter(g.f);
    if (!items.length) return "";
    const list = g.k==="past" ? items.reverse().slice(0,10) : items;
    return `<div class="group ${g.k}"><h2>${g.l}<span class="count">${items.length}</span></h2><div class="list">${list.map(evRow).join("")}</div></div>`;
  }).join("");
  $("#agenda").innerHTML = html || `<div class="empty">条件に合う予定はありません。</div>`;
}

function renderCal(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $("#ymLbl").innerHTML = `<span class="mono">${y}</span>年 <span class="mono">${m+1}</span>月`;
  const start = new Date(y,m,1); start.setDate(1-start.getDay());
  const end = new Date(y,m+1,0); const days = Math.ceil((end - start)/86400000 + 1); const total = Math.ceil(days/7)*7;
  const byDate = {};
  for (const e of allEvents()) (byDate[e.date] ||= []).push(e);
  const tStr = ymd(today());
  let h = WD.map((w,i)=>`<div class="dow ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
  for (let i=0;i<total;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const s = ymd(d), evs = byDate[s]||[];
    const cls = [d.getMonth()!==m?"out":"", d.getDay()===0?"sun":d.getDay()===6?"sat":"", s===tStr?"today":""].join(" ");
    const shown = evs.slice(0,3);
    h += `<div class="cell ${cls}" data-date="${s}"><span class="num">${d.getDate()}</span><div class="cevs">${
      shown.map(e=>`<button type="button" class="cev ty-${e.type} ${e.done?"done":""}" data-ev="${e.co.id}|${e.id}" title="${esc(e.co.name+" "+(TYPE[e.type]?.l||""))}">${esc((e.time?e.time+" ":"")+e.co.name)}</button>`).join("")
    }</div>${evs.length>3?`<span class="more">+${evs.length-3}件</span>`:""}</div>`;
  }
  $("#cal").innerHTML = h;
  $("#legend").innerHTML = TYPES.map(t=>`<span class="chip ty-${t.k}">${t.l}</span>`).join("");
}

function renderBoard(){
  $("#board").innerHTML = STAGES.map(st=>{
    const cs = state.companies.filter(c=>c.stage===st).sort((a,b)=>(b.priority||0)-(a.priority||0));
    return `<div class="col ${st==="お見送り"?"ng":""}"><h3>${st}<span class="mono">${cs.length}</span></h3>${
      cs.map(c=>{
        const nx = (c.events||[]).filter(e=>!e.done && diffDays(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
        return `<button type="button" class="card" data-co="${c.id}">
          <span class="nm"><span>${esc(c.name)}</span><span class="stars" aria-label="志望度${c.priority}">${"★".repeat(c.priority||1)}</span></span>
          ${c.industry?`<span class="ind">${esc(c.industry)}</span>`:""}
          ${nx?`<span class="nx"><span class="chip ty-${nx.type}">${esc(TYPE[nx.type]?.l)}</span><span class="mono">${fmtMD(nx.date)}</span><span class="note">${leftLabel(diffDays(nx.date))}</span></span>`:""}
        </button>`;}).join("")
    }</div>`;
  }).join("");
}

/* ---------- interactions ---------- */
document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if (tab){ view = tab.dataset.view; try{localStorage.setItem("shk.view",view);}catch{} render(); return; }
  const tf = e.target.closest("[data-type]");
  if (tf){ const k=tf.dataset.type; typeFilter.has(k)?typeFilter.delete(k):typeFilter.add(k); renderFilters(); renderAgenda(); return; }
  const evb = e.target.closest("[data-ev]");
  if (evb){ const [c,id]=evb.dataset.ev.split("|"); openEv(c,id); return; }
  const cob = e.target.closest("[data-co]");
  if (cob){ openCo(cob.dataset.co); return; }
  const cell = e.target.closest(".cell");
  if (cell && !e.target.closest(".cev")){ openEv(null,null,cell.dataset.date); return; }
  if (e.target.matches("[data-close]")) e.target.closest("dialog").close();
});
document.addEventListener("change", async e=>{
  if (!e.target.matches("[data-done]")) return;
  const [cid,eid] = e.target.dataset.done.split("|");
  const c = structuredClone(state.companies.find(x=>x.id===cid)); if(!c) return;
  const ev = c.events.find(x=>x.id===eid); ev.done = e.target.checked;
  await persist(c);
});
$("#prevM").onclick=()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);renderCal();};
$("#nextM").onclick=()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);renderCal();};
$("#thisM").onclick=()=>{const d=today();calMonth=new Date(d.getFullYear(),d.getMonth(),1);renderCal();};
$("#addCoBtn").onclick=()=>openCo(null);
$("#addEvBtn").onclick=()=>openEv(null,null);

function armDelete(btn, fn){
  btn.classList.remove("armed"); btn.textContent="削除";
  btn.onclick=()=>{ if(btn.classList.contains("armed")) fn(); else { btn.classList.add("armed"); btn.textContent="本当に削除する"; } };
}

/* company dialog */
$("#coStage").innerHTML = STAGES.map(s=>`<option>${s}</option>`).join("");
let editingCo=null;
function openCo(id){
  const c = id ? state.companies.find(x=>x.id===id) : null;
  editingCo = c ? c.id : null;
  $("#coDlgTtl").textContent = c ? c.name : "企業を追加";
  $("#coName").value = c?.name||""; $("#coInd").value=c?.industry||""; $("#coPri").value=String(c?.priority||2);
  $("#coStage").value=c?.stage||"気になる"; $("#coLogin").value=c?.login||""; $("#coUrl").value=c?.url||""; $("#coNote").value=c?.note||"";
  const evs = (c?.events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  $("#coEvents").innerHTML = c ? `<div class="field"><label>この企業の予定</label>${
    evs.map(e=>`<div class="coev"><span class="mono">${fmtMD(e.date)}</span><span class="chip ty-${e.type}">${esc(TYPE[e.type]?.l)}</span><span>${esc(e.title||"")}</span>${e.done?'<span class="note">完了</span>':""}<button type="button" class="rowedit" data-ev="${c.id}|${e.id}">編集</button></div>`).join("") || '<span class="note">まだ予定はありません</span>'
  }<div><button type="button" class="btn" id="coAddEv" style="margin-top:6px">＋ この企業に予定を追加</button></div></div>
  ${c.url?`<div class="linkrow">マイページ：<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></div>`:""}` : "";
  const ab = $("#coAddEv"); if (ab) ab.onclick = ()=>{ $("#coDlg").close(); openEv(c.id,null); };
  $("#coDel").hidden = !c;
  armDelete($("#coDel"), async ()=>{ $("#coDlg").close(); if(state.sample){ state.companies=state.companies.filter(x=>x.id!==c.id); render(); return; } await store.remove(c.id); toast("削除しました"); });
  if (!$("#coDlg").open) $("#coDlg").showModal();
}
$("#coForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const old = editingCo ? state.companies.find(x=>x.id===editingCo) : null;
  const url = $("#coUrl").value.trim();
  const c = {
    id: old?.id || rid(), name: $("#coName").value.trim(), industry: $("#coInd").value.trim(),
    priority: Number($("#coPri").value), stage: $("#coStage").value, login: $("#coLogin").value.trim(),
    url: /^https?:\/\//i.test(url) ? url : "", note: $("#coNote").value, events: structuredClone(old?.events||[]),
    createdAt: old?.createdAt || Date.now(),
  };
  if (!c.name) return;
  $("#coDlg").close();
  try { await persist(c); toast("保存しました"); } catch {}
});

/* event dialog */
$("#evType").innerHTML = TYPES.map(t=>`<option value="${t.k}">${t.l}</option>`).join("");
let editingEv=null;
function openEv(cid, eid, date){
  if ($("#coDlg").open) $("#coDlg").close();
  const c = cid ? state.companies.find(x=>x.id===cid) : null;
  const ev = c && eid ? c.events.find(x=>x.id===eid) : null;
  editingEv = ev ? {cid, eid} : null;
  const cos = state.companies.slice().sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  $("#evCo").innerHTML = cos.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  $("#evCoNote").hidden = cos.length>0;
  $("#evCo").value = cid || cos[0]?.id || "";
  $("#evCo").disabled = !!ev;
  $("#evDlgTtl").textContent = ev ? "予定を編集" : "予定を追加";
  $("#evType").value = ev?.type||"es"; $("#evTitle").value=ev?.title||"";
  $("#evDate").value = ev?.date || date || ymd(today()); $("#evTime").value=ev?.time||"";
  $("#evPlace").value = ev?.place||""; $("#evDone").checked=!!ev?.done;
  $("#evDel").hidden = !ev;
  armDelete($("#evDel"), async ()=>{
    $("#evDlg").close();
    const cc = structuredClone(c); cc.events = cc.events.filter(x=>x.id!==eid);
    await persist(cc); toast("削除しました");
  });
  $("#evDlg").showModal();
}
$("#evForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const cid = editingEv?.cid || $("#evCo").value;
  const base = state.companies.find(x=>x.id===cid);
  if (!base) { toast("先に企業を登録してください"); return; }
  const c = structuredClone(base); c.events ||= [];
  const ev = {id: editingEv?.eid || rid(), type: $("#evType").value, title: $("#evTitle").value.trim(),
    date: $("#evDate").value, time: $("#evTime").value, place: $("#evPlace").value.trim(), done: $("#evDone").checked};
  if (!ev.date) return;
  const i = c.events.findIndex(x=>x.id===ev.id);
  if (i>=0) c.events[i]=ev; else c.events.push(ev);
  $("#evDlg").close();
  try { await persist(c); toast("保存しました"); } catch {}
});

let tt;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2200); }

boot();
})();
</script>
