<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>就活ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#18213B; --muted:#5E6782; --line:#D5DAE5;
  --accent:#2B3A8C; --accent-soft:#E2E6F7;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --paper:#171C2C; --ink:#E7EAF3; --muted:#9AA3BE; --line:#2B3248;
  --accent:#9AA8F5; --accent-soft:#252C4E;
}}
:root[data-theme="dark"]{
  --bg:#0F1320; --paper:#171C2C; --ink:#E7EAF3; --muted:#9AA3BE; --line:#2B3248;
  --accent:#9AA8F5; --accent-soft:#252C4E;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:56px 16px 40px}
h1{font-size:28px;font-weight:900;letter-spacing:.02em}
.lead{color:var(--muted);margin-top:6px}
.cards{display:grid;gap:16px;margin-top:32px}
@media (min-width:600px){.cards{grid-template-columns:1fr 1fr}}
a.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 20px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.tag{display:inline-block;font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:999px}
.card h2{font-size:20px;font-weight:700;margin-top:12px}
.card p{color:var(--muted);font-size:14px;margin-top:4px}
.go{display:block;margin-top:14px;color:var(--accent);font-weight:700;font-size:14px}
footer{color:var(--muted);font-size:12px;margin-top:40px;font-family:var(--f-mono)}
</style>
</head>
<body>
<main>
  <h1>就活ツール</h1>
  <p class="lead">使いたいツールを選んでください。</p>
  <div class="cards">
    <a class="card" href="shukatsu-scheduler.html">
      <span class="tag">01</span>
      <h2>就活スケジューラー</h2>
      <p>予定を入力して、タスクと締め切りをカレンダーで管理します。</p>
      <span class="go">開く →</span>
    </a>
    <a class="card" href="shukatsu-techo.html">
      <span class="tag">02</span>
      <h2>就活手帳</h2>
      <p>企業ごとに、ES・テスト・面接などの選考予定を記録します。</p>
      <span class="go">開く →</span>
    </a>
  </div>
  <footer>matthima715 / shukatsu-scheduler</footer>
</main>
</body>
</html>
